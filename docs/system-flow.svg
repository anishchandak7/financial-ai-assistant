<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.4" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#A855F7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#bg-grad)" />
  <rect width="1200" height="800" fill="url(#grid-pattern)" />

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #F8FAFC; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94A3B8; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #F8FAFC; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #94A3B8; }
    .node-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 600; fill: #38BDF8; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #CBD5E1; }
    .zone-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- HEADER -->
  <g transform="translate(40, 32)">
    <circle cx="12" cy="12" r="10" fill="#38BDF8" opacity="0.15" />
    <circle cx="12" cy="12" r="5" fill="#38BDF8" />
    <text x="32" y="17" class="title">Financial AI Assistant — End-to-End System Workflow</text>
    <text x="32" y="34" class="subtitle">Real-Time Multi-Agent Request Lifecycle, Security Boundaries &amp; Data Pipeline</text>
  </g>

  <!-- ================= ZONES / CONTAINERS ================= -->
  
  <!-- Zone 1: Client & Ingestion -->
  <rect x="30" y="80" width="460" height="110" rx="14" fill="#0F172A" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2" />
  <text x="45" y="100" class="zone-title" fill="#38BDF8">Tier 1: Client &amp; Entry</text>

  <!-- Zone 2: Gateway & Security -->
  <rect x="510" y="80" width="660" height="110" rx="14" fill="#0F172A" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2" />
  <text x="525" y="100" class="zone-title" fill="#F43F5E">Tier 2: Gateway &amp; Defense Guardrail</text>

  <!-- Zone 3: AI Orchestration Core -->
  <rect x="30" y="220" width="1140" height="115" rx="14" fill="#0F172A" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2" />
  <text x="45" y="240" class="zone-title" fill="#A855F7">Tier 3: LangGraph AI Orchestration &amp; Memory</text>

  <!-- Zone 4: Specialist Agents Squad -->
  <rect x="30" y="360" width="1140" height="120" rx="14" fill="#0F172A" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2" />
  <text x="45" y="380" class="zone-title" fill="#10B981">Tier 4: Specialist Financial Agents Squad</text>

  <!-- Zone 5: Data & Compliance Bottom Tier -->
  <rect x="30" y="505" width="1140" height="260" rx="14" fill="#0F172A" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.2" />
  <text x="45" y="525" class="zone-title" fill="#F59E0B">Tier 5: Data Feeds, RAG Vector Store &amp; Compliance</text>

  <!-- ================= NODES ================= -->

  <!-- Node: User -->
  <g transform="translate(45, 115)" filter="url(#shadow)">
    <rect width="180" height="60" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="#38BDF8" fill-opacity="0.15" />
    <text x="28" y="35" text-anchor="middle" font-size="16">👤</text>
    <text x="52" y="27" class="node-title">User / Investor</text>
    <text x="52" y="44" class="node-sub">Desktop / Mobile Client</text>
  </g>

  <!-- Node: Web Dashboard -->
  <g transform="translate(290, 115)" filter="url(#shadow)">
    <rect width="185" height="60" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="#38BDF8" fill-opacity="0.15" />
    <text x="28" y="35" text-anchor="middle" font-size="15">💻</text>
    <text x="52" y="27" class="node-title">React Web App</text>
    <text x="52" y="44" class="node-sub">Chat &amp; PDF Upload :5173</text>
  </g>

  <!-- Node: FastAPI Gateway -->
  <g transform="translate(530, 115)" filter="url(#shadow)">
    <rect width="185" height="60" rx="10" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="#60A5FA" fill-opacity="0.15" />
    <text x="28" y="35" text-anchor="middle" font-size="15">⚡</text>
    <text x="52" y="27" class="node-title">FastAPI Gateway</text>
    <text x="52" y="44" class="node-sub">REST Server :8000</text>
  </g>

  <!-- Node: Input Guardrail -->
  <g transform="translate(775, 115)" filter="url(#shadow)">
    <rect width="195" height="60" rx="10" fill="#1E293B" stroke="#F43F5E" stroke-width="1.8" />
    <circle cx="28" cy="30" r="14" fill="#F43F5E" fill-opacity="0.15" />
    <text x="28" y="35" text-anchor="middle" font-size="15">🛡️</text>
    <text x="52" y="27" class="node-title">Safety Guardrail</text>
    <text x="52" y="44" class="node-sub">Prompt Injection Shield</text>
  </g>

  <!-- Node: Blocked -->
  <g transform="translate(1025, 115)" filter="url(#shadow)">
    <rect width="130" height="60" rx="10" fill="#2A1215" stroke="#EF4444" stroke-width="1.2" />
    <text x="65" y="27" class="node-title" fill="#FCA5A5" text-anchor="middle">⚠️ Blocked</text>
    <text x="65" y="44" class="node-sub" fill="#F87171" text-anchor="middle">Safety Advisory</text>
  </g>

  <!-- Node: Session Memory -->
  <g transform="translate(120, 255)" filter="url(#shadow)">
    <rect width="210" height="62" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="1.4" />
    <circle cx="28" cy="31" r="14" fill="#818CF8" fill-opacity="0.15" />
    <text x="28" y="36" text-anchor="middle" font-size="15">🧠</text>
    <text x="52" y="27" class="node-title">Session Memory</text>
    <text x="52" y="44" class="node-sub">Active Ticker &amp; Context</text>
  </g>

  <!-- Node: LangGraph Orchestrator -->
  <g transform="translate(480, 255)" filter="url(#shadow)">
    <rect width="240" height="62" rx="10" fill="#1E293B" stroke="#C084FC" stroke-width="1.8" />
    <circle cx="28" cy="31" r="14" fill="#C084FC" fill-opacity="0.15" />
    <text x="28" y="36" text-anchor="middle" font-size="15">🔀</text>
    <text x="52" y="27" class="node-title">LangGraph Orchestrator</text>
    <text x="52" y="44" class="node-sub">Adaptive Intent Dispatcher</text>
  </g>

  <!-- Node: Google Gemini -->
  <g transform="translate(860, 255)" filter="url(#shadow)">
    <rect width="220" height="62" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.4" />
    <circle cx="28" cy="31" r="14" fill="#38BDF8" fill-opacity="0.15" />
    <text x="28" y="36" text-anchor="middle" font-size="15">✨</text>
    <text x="52" y="27" class="node-title">Google Gemini 3.6</text>
    <text x="52" y="44" class="node-sub">Flash LLM &amp; Embeddings</text>
  </g>

  <!-- 4 SPECIALIST AGENTS -->
  <!-- Specialist 1: Conversational -->
  <g transform="translate(50, 395)" filter="url(#shadow)">
    <rect width="240" height="65" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
    <circle cx="28" cy="32" r="14" fill="#10B981" fill-opacity="0.15" />
    <text x="28" y="37" text-anchor="middle" font-size="15">💬</text>
    <text x="52" y="27" class="node-title">Conversational Guide</text>
    <text x="52" y="44" class="node-sub">Help, FAQ &amp; Onboarding</text>
  </g>

  <!-- Specialist 2: Market Analyst -->
  <g transform="translate(330, 395)" filter="url(#shadow)">
    <rect width="250" height="65" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
    <circle cx="28" cy="32" r="14" fill="#10B981" fill-opacity="0.15" />
    <text x="28" y="37" text-anchor="middle" font-size="15">📊</text>
    <text x="52" y="27" class="node-title">Market Analyst Agent</text>
    <text x="52" y="44" class="node-sub">Macro Indices &amp; Sector Trends</text>
  </g>

  <!-- Specialist 3: Stock Analyst -->
  <g transform="translate(620, 395)" filter="url(#shadow)">
    <rect width="250" height="65" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
    <circle cx="28" cy="32" r="14" fill="#10B981" fill-opacity="0.15" />
    <text x="28" y="37" text-anchor="middle" font-size="15">📈</text>
    <text x="52" y="27" class="node-title">Stock Analyst Agent</text>
    <text x="52" y="44" class="node-sub">Indicators, RSI, MACD &amp; SMA</text>
  </g>

  <!-- Specialist 4: Finance QA -->
  <g transform="translate(910, 395)" filter="url(#shadow)">
    <rect width="245" height="65" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.4" />
    <circle cx="28" cy="32" r="14" fill="#10B981" fill-opacity="0.15" />
    <text x="28" y="37" text-anchor="middle" font-size="15">📑</text>
    <text x="52" y="27" class="node-title">Finance Q&amp;A Agent</text>
    <text x="52" y="44" class="node-sub">Document RAG &amp; Citations</text>
  </g>

  <!-- DATA & TOOLS ROW -->
  <!-- Yahoo Finance -->
  <g transform="translate(330, 545)" filter="url(#shadow)">
    <rect width="250" height="62" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.4" />
    <circle cx="28" cy="31" r="14" fill="#F59E0B" fill-opacity="0.15" />
    <text x="28" y="36" text-anchor="middle" font-size="15">🌐</text>
    <text x="52" y="27" class="node-title">Yahoo Finance Feed</text>
    <text x="52" y="44" class="node-sub">Real-Time Quotes &amp; News</text>
  </g>

  <!-- Technical Indicators Engine -->
  <g transform="translate(620, 545)" filter="url(#shadow)">
    <rect width="250" height="62" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.4" />
    <circle cx="28" cy="31" r="14" fill="#F59E0B" fill-opacity="0.15" />
    <text x="28" y="36" text-anchor="middle" font-size="15">🧮</text>
    <text x="52" y="27" class="node-title">Technical Tools</text>
    <text x="52" y="44" class="node-sub">Deterministic Formulas</text>
  </g>

  <!-- ChromaDB Vector Store -->
  <g transform="translate(910, 545)" filter="url(#shadow)">
    <rect width="245" height="62" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.4" />
    <circle cx="28" cy="31" r="14" fill="#F59E0B" fill-opacity="0.15" />
    <text x="28" y="36" text-anchor="middle" font-size="15">🗄️</text>
    <text x="52" y="27" class="node-title">ChromaDB Store</text>
    <text x="52" y="44" class="node-sub">Vector Collections &amp; Filings</text>
  </g>

  <!-- COMPLIANCE & OUTPUT ROW -->
  <!-- Compliance Guard -->
  <g transform="translate(330, 680)" filter="url(#shadow)">
    <rect width="320" height="62" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="1.8" />
    <circle cx="28" cy="31" r="14" fill="#EC4899" fill-opacity="0.15" />
    <text x="28" y="36" text-anchor="middle" font-size="15">⚖️</text>
    <text x="52" y="27" class="node-title">Compliance Guard</text>
    <text x="52" y="44" class="node-sub">Sanitizes Claims &amp; Attaches Disclaimers</text>
  </g>

  <!-- Final Output Message -->
  <g transform="translate(730, 680)" filter="url(#shadow)">
    <rect width="360" height="62" rx="10" fill="#064E3B" fill-opacity="0.6" stroke="#10B981" stroke-width="1.8" />
    <circle cx="28" cy="31" r="14" fill="#10B981" fill-opacity="0.2" />
    <text x="28" y="36" text-anchor="middle" font-size="15">✅</text>
    <text x="52" y="27" class="node-title" fill="#A7F3D0">Verified User Response</text>
    <text x="52" y="44" class="node-sub" fill="#6EE7B7">Delivered with Disclaimers &amp; Citations</text>
  </g>


  <!-- ================= CONNECTING FLOW ARROWS ================= -->

  <!-- 1. User -> Web App -->
  <line x1="225" y1="145" x2="282" y2="145" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- 2. Web App -> FastAPI Gateway -->
  <line x1="475" y1="145" x2="522" y2="145" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="480" y="132" width="40" height="15" rx="3" fill="#0B0F19" />
  <text x="500" y="143" class="edge-label" text-anchor="middle">REST</text>

  <!-- 3. Gateway -> Guardrail -->
  <line x1="715" y1="145" x2="767" y2="145" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="720" y="132" width="42" height="15" rx="3" fill="#0B0F19" />
  <text x="741" y="143" class="edge-label" text-anchor="middle">Scan</text>

  <!-- 4a. Guardrail -> Blocked -->
  <line x1="970" y1="145" x2="1017" y2="145" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-red)" />
  <rect x="975" y="132" width="40" height="15" rx="3" fill="#0B0F19" />
  <text x="995" y="143" class="edge-label" fill="#EF4444" text-anchor="middle">Unsafe</text>

  <!-- 4b. Guardrail -> LangGraph Orchestrator (Safe path) -->
  <path d="M 872 175 L 872 205 L 600 205 L 600 247" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <rect x="700" y="197" width="70" height="15" rx="3" fill="#0B0F19" />
  <text x="735" y="208" class="edge-label" fill="#10B981" text-anchor="middle">Safe Input</text>

  <!-- 5. Orchestrator <-> Session Memory -->
  <path d="M 480 286 L 338 286" fill="none" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-blue)" />
  <rect x="375" y="278" width="70" height="15" rx="3" fill="#0B0F19" />
  <text x="410" y="289" class="edge-label" text-anchor="middle">Context</text>

  <!-- 6. Orchestrator <-> Gemini -->
  <path d="M 720 286 L 852 286" fill="none" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <rect x="755" y="278" width="70" height="15" rx="3" fill="#0B0F19" />
  <text x="790" y="289" class="edge-label" text-anchor="middle">Intent Call</text>

  <!-- 7. Orchestrator Fan-Out to 4 Specialists -->
  <!-- To Conversational -->
  <path d="M 520 317 L 520 345 L 170 345 L 170 387" fill="none" stroke="#A855F7" stroke-width="1.8" marker-end="url(#arrow-purple)" />
  <!-- To Market Analyst -->
  <path d="M 570 317 L 570 345 L 455 345 L 455 387" fill="none" stroke="#A855F7" stroke-width="1.8" marker-end="url(#arrow-purple)" />
  <!-- To Stock Analyst -->
  <path d="M 630 317 L 630 345 L 745 345 L 745 387" fill="none" stroke="#A855F7" stroke-width="1.8" marker-end="url(#arrow-purple)" />
  <!-- To Finance QA -->
  <path d="M 680 317 L 680 345 L 1030 345 L 1030 387" fill="none" stroke="#A855F7" stroke-width="1.8" marker-end="url(#arrow-purple)" />

  <!-- 8. Specialists to Data Tools -->
  <!-- Market -> Yahoo -->
  <line x1="455" y1="460" x2="455" y2="537" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <!-- Stock -> Yahoo -->
  <path d="M 710 460 L 710 500 L 490 500 L 490 537" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow-amber)" />
  <!-- Stock -> Technical Tools -->
  <line x1="745" y1="460" x2="745" y2="537" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-amber)" />
  <!-- QA -> ChromaDB -->
  <line x1="1032" y1="460" x2="1032" y2="537" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-amber)" />

  <!-- 9. Specialists / Tools Down to Compliance Guard -->
  <!-- Conversational -> Compliance -->
  <path d="M 170 460 L 170 645 L 490 645 L 490 672" fill="none" stroke="#EC4899" stroke-width="1.6" marker-end="url(#arrow-purple)" />
  <!-- Market / Stock / Tools -> Compliance -->
  <path d="M 600 607 L 600 645 L 530 645 L 530 672" fill="none" stroke="#EC4899" stroke-width="1.8" marker-end="url(#arrow-purple)" />
  <!-- QA -> Compliance -->
  <path d="M 1032 607 L 1032 645 L 570 645 L 570 672" fill="none" stroke="#EC4899" stroke-width="1.8" marker-end="url(#arrow-purple)" />

  <!-- 10. Compliance -> Final Output -->
  <line x1="650" y1="711" x2="722" y2="711" stroke="#10B981" stroke-width="2.2" marker-end="url(#arrow-emerald)" />
  <rect x="658" y="700" width="58" height="15" rx="3" fill="#0B0F19" />
  <text x="687" y="711" class="edge-label" fill="#10B981" text-anchor="middle">Audited</text>

  <!-- 11. Final Output Back to UI -->
  <path d="M 910 742 L 910 770 L 10 770 L 10 145 L 40 145" fill="none" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />
  <rect x="420" y="760" width="160" height="16" rx="3" fill="#0B0F19" />
  <text x="500" y="772" class="edge-label" fill="#38BDF8" text-anchor="middle">11. Render Formatted Reply in UI</text>

</svg>
